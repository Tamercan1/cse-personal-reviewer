<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Vocabulary Challenge - CSE Reviewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        blue: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87'
                        },
                        indigo: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c7d2fe',
                            400: '#a5b4fc',
                            500: '#818cf8',
                            600: '#6366f1',
                            700: '#4f46e5',
                            800: '#4338ca',
                            900: '#3730a3'
                        },
                        violet: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',
                            900: '#701a75'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-full">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header Controls / Navigation back -->
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 select-none">
            <div>
                <a href="vocabulary.html" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-slate-500 hover:text-blue-600 transition-colors mb-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
                    </svg>
                    <span>Back to Vocabulary Digest</span>
                </a>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Daily Vocabulary Challenge</h1>
                <p id="quiz-subtitle" class="text-sm text-slate-500 mt-0.5">Test your memory of today's vocabulary set.</p>
            </div>
            <div id="day-badge" class="self-start sm:self-auto px-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-sm font-extrabold text-slate-800 font-mono">
                Day 1 Quiz
            </div>
        </div>

        <!-- Quiz Card Container -->
        <div id="quiz-card" class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm flex flex-col justify-between min-h-[350px]">
            <div id="quiz-card-body">
                <!-- Progress & Score Indicator -->
                <div class="flex justify-between items-center mb-4 select-none">
                    <span id="question-index-label" class="inline-block text-xs font-bold px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100 uppercase tracking-wide">
                        Question 1
                    </span>
                    <span id="progress-text" class="text-xs font-semibold text-slate-400">
                        Question 1 of 5
                    </span>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-2 mb-8 overflow-hidden select-none">
                    <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 20%;"></div>
                </div>

                <!-- Question Text -->
                <h3 id="question-text" class="text-lg sm:text-xl font-bold text-slate-800 mb-8 leading-relaxed">
                    Loading challenge...
                </h3>

                <!-- Choices Grid -->
                <div id="choices-container" class="space-y-3 mb-8">
                    <!-- Loaded Dynamically -->
                </div>

                <!-- Explanation Box (Initially hidden) -->
                <div id="explanation-box" class="hidden bg-emerald-50/35 border border-emerald-150 rounded-2xl p-5 mb-8">
                    <div class="flex items-center space-x-2 text-emerald-800 font-bold text-sm mb-2 select-none">
                        <svg class="w-4 h-4 text-emerald-600 fill-none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .5 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
                            <path d="M9 18h6"/>
                            <path d="M10 22h4"/>
                        </svg>
                        <span>Explanation & Solution</span>
                    </div>
                    <p id="explanation-text" class="text-emerald-700 text-xs sm:text-sm leading-relaxed">
                        Explanation details.
                    </p>
                </div>
            </div>

            <!-- Quiz Completion Panel (Initially Hidden) -->
            <div id="quiz-completion-panel" class="hidden">
                <!-- Renders dynamically -->
            </div>

            <!-- Footer Action Button -->
            <div id="quiz-card-footer" class="border-t border-slate-100 pt-6 mt-4 sticky bottom-0 bg-white z-10 rounded-b-3xl">
                <button id="action-btn" disabled class="w-full py-3.5 bg-slate-150 text-slate-400 font-semibold rounded-xl transition-all cursor-not-allowed">
                    Submit Answer
                </button>
            </div>
        </div>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Core App Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/vocab-quiz.js"></script>
</body>
</html>
