<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Dashboard - CSE Reviewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-full">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Dashboard Header -->
        <div class="mb-8">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Performance Dashboard</h1>
            <p class="text-sm text-slate-500">Track your exam simulation scores and drill down into subtest category analytics.</p>
        </div>

        <!-- Dynamic Results Content Container -->
        <div id="dashboard-content">
            <div class="text-center py-12">
                <p class="text-slate-400 text-sm">Loading performance metrics...</p>
            </div>
        </div>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Core App Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    
    <!-- Inline Dashboard Controller -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lastResult = load('cse_last_exam_result', null);
            const contentContainer = document.getElementById('dashboard-content');
            
            if (!lastResult) {
                // Render empty state if no exam has been taken
                contentContainer.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-sm max-w-xl mx-auto py-12">
                        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 border border-blue-100 shadow-sm select-none">
                            <svg class="w-8 h-8 text-blue-600 fill-none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v5.625C7.5 19.375 6.996 19.875 6.375 19.875h-2.25A1.125 1.125 0 013 18.75v-5.625zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v10.125c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v14.625c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-slate-800 mb-2">No Simulation Results Found</h2>
                        <p class="text-slate-500 text-sm leading-relaxed mb-6 max-w-sm mx-auto">
                            You haven't completed any full exam simulations yet.
                        </p>
                        <div class="flex flex-col sm:flex-row justify-center gap-3">
                            <a href="exam.html" class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-center shadow-md shadow-blue-100 transition-all text-sm">
                                Start Exam Simulation
                            </a>
                            <a href="../index.html" class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl text-center transition-all text-sm">
                                Back to Home
                            </a>
                        </div>
                    </div>
                `;
                return;
            }
            
            const minutesSpent = Math.floor(lastResult.timeSpent / 60);
            const secondsSpent = lastResult.timeSpent % 60;
            const timeFormatted = `${minutesSpent}m ${secondsSpent}s`;
            
            let categoriesHTML = '';
            for (const [catName, stats] of Object.entries(lastResult.categoryStats)) {
                const percent = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
                categoriesHTML += `
                    <div class="bg-slate-50 border border-slate-100 rounded-2xl p-5 hover:bg-slate-100/30 transition-all">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-slate-700 text-sm">${catName}</span>
                            <span class="text-xs font-semibold text-slate-500">${stats.correct} / ${stats.total} (${percent}%)</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div class="h-2 rounded-full ${percent >= 80 ? 'bg-emerald-500' : 'bg-blue-500'}" style="width: ${percent}%;"></div>
                        </div>
                    </div>
                `;
            }
            
            let mistakesHTML = '';
            let mistakeCount = 0;
            lastResult.questionsLog.forEach((logItem, index) => {
                const isIncorrect = !logItem.isCorrect;
                if (isIncorrect) {
                    mistakeCount++;
                    mistakesHTML += `
                        <div class="border border-slate-200 bg-white rounded-2xl p-5 hover:shadow-sm transition-all space-y-4">
                            <div class="flex justify-between items-start flex-col sm:flex-row sm:items-center gap-2">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-rose-50 text-rose-700 border border-rose-100 uppercase tracking-wide">Q${index + 1}</span>
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 border border-slate-200">${logItem.category}</span>
                                </div>
                                <span class="text-xs text-rose-500 font-bold flex items-center space-x-1 select-none">
                                    <svg class="w-3.5 h-3.5 text-rose-500 fill-none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                                    </svg>
                                    <span>Incorrect Selection</span>
                                </span>
                            </div>
                            
                            <p class="text-slate-800 text-sm font-bold leading-relaxed">${logItem.question}</p>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                                <div class="p-3 rounded-xl bg-rose-50/30 border border-rose-100 text-rose-800">
                                    <span class="font-bold block uppercase text-[9px] text-rose-400 tracking-wider mb-0.5">Your Answer</span>
                                    <span>${logItem.userAnswer || 'No Answer Selected'}</span>
                                </div>
                                <div class="p-3 rounded-xl bg-emerald-50/30 border border-emerald-100 text-emerald-800">
                                    <span class="font-bold block uppercase text-[9px] text-emerald-400 tracking-wider mb-0.5">Correct Answer</span>
                                    <span>${logItem.correctAnswer}</span>
                                </div>
                            </div>
                            
                            <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                                <div class="flex items-center space-x-1.5 font-bold text-slate-700 mb-1 select-none">
                                    <svg class="w-4 h-4 text-slate-500 fill-none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .5 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
                                        <path d="M9 18h6"/>
                                        <path d="M10 22h4"/>
                                    </svg>
                                    <span class="text-xs uppercase tracking-wider font-bold">Solution Explanation</span>
                                </div>
                                <p class="text-slate-600 leading-relaxed">${logItem.explanation}</p>
                            </div>
                        </div>
                    `;
                }
            });
            
            contentContainer.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                    <div class="lg:col-span-1 bg-white border border-slate-200 rounded-3xl p-6 shadow-sm text-center flex flex-col justify-between">
                        <div class="py-6">
                            <span class="text-slate-400 text-xs font-bold uppercase tracking-wider block mb-4">Exam Verdict</span>
                            
                            <div class="relative w-40 h-40 mx-auto mb-6 flex items-center justify-center">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="42" stroke="#f1f5f9" stroke-width="8" fill="transparent" />
                                    <circle cx="50" cy="50" r="42" stroke="${lastResult.passed ? '#10b981' : '#3b82f6'}" stroke-width="8" fill="transparent" 
                                            stroke-dasharray="263.89" stroke-dashoffset="${263.89 - (263.89 * lastResult.percentage / 100)}" />
                                </svg>
                                <div class="absolute inset-0 flex flex-col items-center justify-center">
                                    <span class="text-4xl font-extrabold text-slate-800">${lastResult.percentage}%</span>
                                    <span class="text-xs text-slate-400 mt-0.5">${lastResult.score} / ${lastResult.total} Qs</span>
                                </div>
                            </div>
                            
                            <span class="inline-block text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4 border ${
                                lastResult.passed 
                                ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                                : 'bg-slate-100 text-slate-600 border-slate-200'
                            }">
                                ${lastResult.passed ? 'PASSED (≥80%)' : 'PRACTICED (<80%)'}
                            </span>
                            
                            <p class="text-slate-500 text-xs sm:text-sm leading-relaxed max-w-xs mx-auto">
                                ${lastResult.passed 
                                    ? 'Outstanding! You surpassed the 80% benchmark. You are well prepared for the official CSE.' 
                                    : 'Keep reviewing to reach the 80% passing standard. Focus on your weaker subtests below.'}
                            </p>
                        </div>
                        
                        <div class="border-t border-slate-100 pt-5 mt-4 grid grid-cols-2 gap-4 text-left">
                            <div>
                                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Duration</span>
                                <span class="text-sm font-extrabold text-slate-700">${timeFormatted}</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Date Finished</span>
                                <span class="text-sm font-extrabold text-slate-700 truncate block">${lastResult.date}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-3xl p-6 shadow-sm flex flex-col justify-between">
                        <div>
                            <span class="text-slate-400 text-xs font-bold uppercase tracking-wider block mb-4">Category Analysis</span>
                            <div class="space-y-4">
                                ${categoriesHTML}
                            </div>
                        </div>
                        
                        <div class="border-t border-slate-100 pt-5 mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <a href="exam.html" class="py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-center shadow-md shadow-blue-100 transition-all text-sm">
                                Retake Simulation
                            </a>
                            <a href="../index.html" class="py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl text-center transition-all text-sm">
                                Continue Studying
                            </a>
                        </div>
                    </div>
                </div>

                <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm mb-8">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800 tracking-tight">Review Incorrect Answers</h3>
                            <p class="text-slate-500 text-xs mt-1">Review the ${mistakeCount} questions you missed and read their step-by-step solutions.</p>
                        </div>
                        <button id="toggle-mistakes-btn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-colors cursor-pointer">
                            Hide Mistakes
                        </button>
                    </div>
                    
                    <div id="mistakes-list" class="space-y-4 transition-all duration-300">
                        ${mistakeCount === 0 
                            ? `<div class="text-center py-8 text-emerald-600 font-bold text-sm flex items-center justify-center space-x-2 select-none">
                                 <svg class="w-5 h-5 text-emerald-600 fill-none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                     <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0110 21a3.745 3.745 0 01-3.068-1.593 3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.746 3.746 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0114 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z"/>
                                 </svg>
                                 <span>Perfect score! No mistakes to review. Outstanding work!</span>
                               </div>` 
                            : mistakesHTML}
                    </div>
                </div>
            `;
            
            const toggleBtn = document.getElementById('toggle-mistakes-btn');
            const mistakesList = document.getElementById('mistakes-list');
            if (toggleBtn && mistakesList) {
                toggleBtn.addEventListener('click', () => {
                    const isHidden = mistakesList.classList.contains('hidden');
                    if (isHidden) {
                        mistakesList.classList.remove('hidden');
                        toggleBtn.textContent = 'Hide Mistakes';
                    } else {
                        mistakesList.classList.add('hidden');
                        toggleBtn.textContent = 'Show Mistakes';
                    }
                });
            }
        });
    </script>
</body>
</html>
