<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Quiz - CSE Reviewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-full">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Page Title & Navigation Info -->
        <div class="mb-6">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Practice Mode</h1>
            <p class="text-sm text-slate-500">Select a category below to test your knowledge with immediate step-by-step solutions.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Left Sidebar Category Selector -->
            <div class="lg:col-span-1 space-y-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-3 pl-2">Quiz Categories</span>
                
                <button data-category="Numerical" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-blue-200 bg-blue-50/50 text-blue-700 font-semibold flex justify-between items-center transition-all shadow-sm">
                    <span>Numerical Reasoning</span>
                    <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                </button>
                
                <button data-category="Verbal" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-slate-100 hover:bg-slate-50 text-slate-600 font-medium flex justify-between items-center transition-all">
                    <span>Verbal Reasoning</span>
                    <span class="text-xs bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                </button>
                
                <button data-category="Analytical" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-slate-100 hover:bg-slate-50 text-slate-600 font-medium flex justify-between items-center transition-all">
                    <span>Analytical Reasoning</span>
                    <span class="text-xs bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                </button>
                
                <button data-category="Clerical" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-slate-100 hover:bg-slate-50 text-slate-600 font-medium flex justify-between items-center transition-all">
                    <span>Clerical Ability</span>
                    <span class="text-xs bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                </button>
                
                <button data-category="General Information" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-slate-100 hover:bg-slate-50 text-slate-600 font-medium flex justify-between items-center transition-all">
                    <span>General Information</span>
                    <span class="text-xs bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                </button>
            </div>

            <!-- Main Question Area -->
            <div class="lg:col-span-3">
                <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm flex flex-col justify-between min-h-[400px]">
                    <div id="quiz-card-body">
                        <!-- Card Header: Category & Progress -->
                        <div class="flex justify-between items-center mb-6">
                            <span id="question-category" class="inline-block text-xs font-bold px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100 uppercase tracking-wide">
                                Numerical Reasoning
                            </span>
                            <span id="progress-text" class="text-xs font-semibold text-slate-400">
                                Question 1 of 5
                            </span>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-100 rounded-full h-2 mb-8 overflow-hidden">
                            <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 20%;"></div>
                        </div>

                        <!-- Question Text -->
                        <h3 id="question-text" class="text-lg sm:text-xl font-bold text-slate-800 mb-8 leading-relaxed">
                            Loading question...
                        </h3>

                        <!-- Choices Grid -->
                        <div id="choices-container" class="space-y-3 mb-8">
                            <!-- Loaded Dynamically via JS -->
                        </div>

                        <!-- Explanation Box (Initially hidden) -->
                        <div id="explanation-box" class="hidden bg-emerald-50/35 border border-emerald-150 rounded-2xl p-5 mb-8">
                            <div class="flex items-center space-x-2 text-emerald-800 font-bold text-sm mb-2">
                                <span>💡</span>
                                <span>Explanation & Solution</span>
                            </div>
                            <p id="explanation-text" class="text-emerald-700 text-xs sm:text-sm leading-relaxed">
                                Detailed explanation text.
                            </p>
                        </div>
                    </div>

                    <!-- Footer Action Button -->
                    <div id="quiz-card-footer" class="border-t border-slate-100 pt-6 mt-4">
                        <button id="action-btn" disabled class="w-full py-3.5 bg-slate-100 text-slate-400 font-semibold rounded-xl transition-all cursor-not-allowed">
                            Submit Answer
                        </button>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Core App Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/quiz.js"></script>
</body>
</html>
