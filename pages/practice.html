<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Quiz - CSE Reviewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        blue: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87'
                        },
                        indigo: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c7d2fe',
                            400: '#a5b4fc',
                            500: '#818cf8',
                            600: '#6366f1',
                            700: '#4f46e5',
                            800: '#4338ca',
                            900: '#3730a3'
                        },
                        violet: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',
                            900: '#701a75'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-full">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Page Title & Navigation Info -->
        <div class="mb-6">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Practice Mode</h1>
        </div>

        <!-- Resume Notification Card (Initially Hidden) -->
        <div id="resume-card" class="hidden sticky top-[68px] z-40 mb-6 bg-white border border-slate-200 rounded-2xl p-5 shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4 animate-in fade-in slide-in-from-top-4 duration-300">
            <div class="flex items-start space-x-3.5">
                <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-blue-600 fill-none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h4 class="text-sm font-bold text-slate-800">Continue Previous Session</h4>
                    <p class="text-xs text-slate-500 mt-0.5">We found an unfinished study session in <span id="resume-session-details" class="font-semibold text-slate-600">Numerical Reasoning</span>.</p>
                </div>
            </div>
            <div class="flex items-center space-x-2.5">
                <button id="resume-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition-all shadow-sm cursor-pointer">
                    Resume
                </button>
                <button id="start-over-btn" class="px-4 py-2 bg-slate-100 hover:bg-slate-250 text-slate-600 text-xs font-semibold rounded-lg border border-slate-200 transition-all cursor-pointer">
                    Start Over
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Left Sidebar Category Selector & Desktop Explanation Box -->
            <div class="lg:col-span-1 space-y-6">
                <div class="space-y-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-3 pl-2">Select Quiz Category</span>
                    
                    <button data-category="Numerical" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-blue-200 bg-blue-50/50 text-blue-700 font-semibold flex justify-between items-center transition-all shadow-sm">
                        <span>Numerical Reasoning</span>
                        <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                    </button>
                    
                    <button data-category="Verbal" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-slate-100 hover:bg-slate-50 text-slate-600 font-medium flex justify-between items-center transition-all">
                        <span>Verbal Reasoning</span>
                        <span class="text-xs bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                    </button>
                    
                    <button data-category="Analytical" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-slate-100 hover:bg-slate-50 text-slate-600 font-medium flex justify-between items-center transition-all">
                        <span>Analytical Reasoning</span>
                        <span class="text-xs bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                    </button>
                    
                    <button data-category="Clerical" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-slate-100 hover:bg-slate-50 text-slate-600 font-medium flex justify-between items-center transition-all">
                        <span>Clerical Ability</span>
                        <span class="text-xs bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                    </button>
                    
                    <button data-category="General Information" class="category-tab w-full text-left px-4 py-3 rounded-xl border border-slate-100 hover:bg-slate-50 text-slate-600 font-medium flex justify-between items-center transition-all">
                        <span>General Information</span>
                        <span class="text-xs bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md">5 Qs</span>
                    </button>
                </div>

                <!-- Desktop Explanation Box (Only visible on lg screens) -->
                <div class="hidden lg:block">
                    <div id="explanation-box-desktop" class="hidden bg-emerald-50/35 border border-emerald-150 rounded-2xl p-5 shadow-sm">
                        <div class="flex items-center space-x-2 text-emerald-800 font-bold text-sm mb-2 select-none">
                            <svg class="w-4 h-4 text-emerald-600 fill-none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .5 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
                                <path d="M9 18h6"/>
                                <path d="M10 22h4"/>
                            </svg>
                            <span>Explanation & Solution</span>
                        </div>
                        <p id="explanation-text-desktop" class="text-emerald-700 text-xs sm:text-sm leading-relaxed">
                            Detailed explanation text.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Main Question Area -->
            <div class="lg:col-span-3">
                <div id="quiz-card" class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm flex flex-col justify-between min-h-[300px] scroll-mt-20">
                    <div id="quiz-card-body">
                        <!-- Card Header: Category & Progress -->
                        <div class="flex justify-between items-center mb-6">
                            <span id="question-category" class="inline-block text-xs font-bold px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100 uppercase tracking-wide">
                                Numerical Reasoning
                            </span>
                            <span id="progress-text" class="text-xs font-semibold text-slate-400">
                                Question 1 of 5
                            </span>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-100 rounded-full h-2 mb-8 overflow-hidden">
                            <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 20%;"></div>
                        </div>

                        <!-- Question Text -->
                        <h3 id="question-text" class="text-lg sm:text-xl font-bold text-slate-800 mb-8 leading-relaxed">
                            Loading question...
                        </h3>

                        <!-- Choices Grid -->
                        <div id="choices-container" class="space-y-3 mb-8">
                            <!-- Loaded Dynamically via JS -->
                        </div>

                        <!-- Explanation Box (Initially hidden) -->
                        <div id="explanation-box" class="hidden lg:hidden bg-emerald-50/35 border border-emerald-150 rounded-2xl p-5 mb-8">
                            <div class="flex items-center space-x-2 text-emerald-800 font-bold text-sm mb-2 select-none">
                                <svg class="w-4 h-4 text-emerald-600 fill-none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .5 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
                                    <path d="M9 18h6"/>
                                    <path d="M10 22h4"/>
                                </svg>
                                <span>Explanation & Solution</span>
                            </div>
                            <p id="explanation-text" class="text-emerald-700 text-xs sm:text-sm leading-relaxed">
                                Detailed explanation text.
                            </p>
                        </div>
                    </div>

                    <!-- Quiz Completion Panel (Initially Hidden) -->
                    <div id="quiz-completion-panel" class="hidden"></div>

                    <!-- Footer Action Button -->
                    <div id="quiz-card-footer" class="border-t border-slate-100 pt-6 mt-4 sticky bottom-0 bg-white z-10 pb-6 rounded-b-3xl -mx-6 px-6 sm:-mx-8 sm:px-8">
                        <button id="action-btn" disabled class="w-full py-3.5 bg-slate-100 text-slate-400 font-semibold rounded-xl transition-all cursor-not-allowed">
                            Submit Answer
                        </button>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Core App Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/quiz.js"></script>
</body>
</html>
