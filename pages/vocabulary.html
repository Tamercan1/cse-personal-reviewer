<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Digest - CSE Reviewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-full">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header Controls (Day changer) -->
        <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm mb-8 flex flex-col sm:flex-row sm:justify-between sm:items-center space-y-4 sm:space-y-0">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Vocabulary Digest</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Study 3 selected terms daily to elevate your vocabulary subtest percentile.</p>
            </div>
            
            <!-- Navigation controls -->
            <div class="flex items-center space-x-3">
                <button id="prev-day-btn" disabled class="px-4 py-2.5 bg-slate-50 text-slate-300 font-semibold rounded-xl border border-slate-100 cursor-not-allowed text-sm flex items-center space-x-1">
                    &larr; Prev Day
                </button>
                <span id="day-indicator" class="text-base font-extrabold text-slate-800 px-4 py-2 bg-slate-100 border border-slate-250 rounded-xl min-w-[90px] text-center font-mono select-none">
                    Day 1
                </span>
                <button id="next-day-btn" class="px-4 py-2.5 bg-white text-slate-600 font-semibold rounded-xl border border-slate-200 hover:border-blue-400 hover:text-blue-600 transition-all text-sm flex items-center space-x-1 cursor-pointer">
                    Next Day &rarr;
                </button>
            </div>
        </div>

        <!-- Vocabulary Cards List Container -->
        <div id="vocabulary-list-container" class="space-y-6">
            <!-- Loaded dynamically via js/vocabulary.js -->
        </div>

        <!-- Informative Motivation Footer -->
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-5 mt-10 text-center">
            <span class="text-xl mb-1 block">💡</span>
            <p class="text-blue-700 text-xs sm:text-sm font-medium leading-relaxed max-w-lg mx-auto">
                Did you know? Consistent reading of 3 words a day expands your verbal comprehension exponentially. Keep checking back daily!
            </p>
        </div>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Core App Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/vocabulary.js"></script>
</body>
</html>
