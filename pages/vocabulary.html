<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Digest - CSE Reviewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        blue: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87'
                        },
                        indigo: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c7d2fe',
                            400: '#a5b4fc',
                            500: '#818cf8',
                            600: '#6366f1',
                            700: '#4f46e5',
                            800: '#4338ca',
                            900: '#3730a3'
                        },
                        violet: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',
                            900: '#701a75'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-full">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header Controls (Day changer) -->
        <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm mb-8 flex flex-col sm:flex-row sm:justify-between sm:items-center space-y-4 sm:space-y-0">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Vocabulary Digest</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Master 20 words a day to boost your vocabulary</p>
            </div>
            
            <!-- Navigation controls -->
            <div class="flex items-center space-x-3">
                <button id="prev-day-btn" disabled class="px-4 py-2.5 bg-slate-50 text-slate-300 font-semibold rounded-xl border border-slate-100 cursor-not-allowed text-sm flex items-center space-x-1.5 select-none">
                    <svg class="w-4 h-4 text-slate-350" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    <span>Prev Day</span>
                </button>
                <span id="day-indicator" class="text-base font-extrabold text-slate-800 px-4 py-2 bg-slate-100 border border-slate-250 rounded-xl min-w-[90px] text-center font-mono select-none">
                    Day 1
                </span>
                <button id="next-day-btn" class="px-4 py-2.5 bg-white text-slate-655 font-semibold rounded-xl border border-slate-200 hover:border-blue-400 hover:text-blue-600 transition-all text-sm flex items-center space-x-1.5 cursor-pointer select-none">
                    <span>Next Day</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Vocabulary Cards List Container -->
        <div id="vocabulary-list-container" class="space-y-6">
            <!-- Loaded dynamically via js/vocabulary.js -->
        </div>

        <!-- Daily Vocabulary Challenge Card -->
        <div class="bg-blue-50 border border-blue-100 rounded-3xl p-6 mt-10 flex flex-col md:flex-row items-center justify-between gap-6 shadow-sm select-none">
            <div class="flex items-start gap-4">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-2xl border border-blue-200 shrink-0">
                    <!-- Modern study SVG (Book Open) -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"></path>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-slate-800">Daily Vocabulary Challenge</h3>
                    <p class="text-sm text-slate-650 mt-1 max-w-xl">
                        You have finished today's vocabulary set. Strengthen your memory with a short quiz based on today's words.
                    </p>
                    <div class="flex flex-wrap gap-3 mt-3">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-blue-100/50 text-blue-700 text-xs font-semibold border border-blue-200/50">
                            <!-- Question SVG -->
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"></path>
                            </svg>
                            15 Questions
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-semibold border border-emerald-100">
                            <!-- Clock SVG -->
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path>
                            </svg>
                            Est. Time: 5-8 mins
                        </span>
                    </div>
                </div>
            </div>
            <a href="vocab-quiz.html" class="w-full md:w-auto text-center shrink-0 px-6 py-3 bg-blue-600 text-white hover:bg-blue-700 font-bold rounded-2xl shadow-sm hover:shadow transition-all text-sm flex items-center justify-center space-x-2">
                <span>Start Today's Quiz</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
                </svg>
            </a>
        </div>

        <!-- Bottom Page Controls -->
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-200 pt-6">
            <!-- Left: Previous Day Button -->
            <button id="prev-day-btn-bottom" disabled class="w-full sm:w-auto px-5 py-3 bg-slate-50 text-slate-350 font-semibold rounded-2xl border border-slate-100 cursor-not-allowed text-sm flex items-center justify-center space-x-1.5 select-none transition-all">
                <svg class="w-4 h-4 text-slate-350" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span>Previous Day</span>
            </button>
            
            <!-- Center: Return to Top Button -->
            <button id="back-to-top-btn" class="w-full sm:w-auto px-5 py-3 bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold rounded-2xl border border-blue-200 text-sm flex items-center justify-center space-x-2 transition-all cursor-pointer">
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"></path>
                </svg>
                <span>Return to Top</span>
            </button>
            
            <!-- Right: Next Day Button -->
            <button id="next-day-btn-bottom" class="w-full sm:w-auto px-5 py-3 bg-white text-slate-655 font-semibold rounded-2xl border border-slate-200 hover:border-blue-400 hover:text-blue-600 transition-all text-sm flex items-center justify-center space-x-1.5 cursor-pointer select-none">
                <span>Next Day</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Core App Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/vocabulary.js"></script>
</body>
</html>
