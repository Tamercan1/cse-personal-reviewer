<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Digest - CSE Reviewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-full">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header Controls (Day changer) -->
        <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm mb-8 flex flex-col sm:flex-row sm:justify-between sm:items-center space-y-4 sm:space-y-0">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Vocabulary Digest</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Study 3 selected terms daily to elevate your vocabulary subtest percentile.</p>
            </div>
            
            <!-- Navigation controls -->
            <div class="flex items-center space-x-3">
                <button id="prev-day-btn" disabled class="px-4 py-2.5 bg-slate-50 text-slate-300 font-semibold rounded-xl border border-slate-100 cursor-not-allowed text-sm flex items-center space-x-1.5 select-none">
                    <svg class="w-4 h-4 text-slate-350" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    <span>Prev Day</span>
                </button>
                <span id="day-indicator" class="text-base font-extrabold text-slate-800 px-4 py-2 bg-slate-100 border border-slate-250 rounded-xl min-w-[90px] text-center font-mono select-none">
                    Day 1
                </span>
                <button id="next-day-btn" class="px-4 py-2.5 bg-white text-slate-655 font-semibold rounded-xl border border-slate-200 hover:border-blue-400 hover:text-blue-600 transition-all text-sm flex items-center space-x-1.5 cursor-pointer select-none">
                    <span>Next Day</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Vocabulary Cards List Container -->
        <div id="vocabulary-list-container" class="space-y-6">
            <!-- Loaded dynamically via js/vocabulary.js -->
        </div>

        <!-- Informative Motivation Footer -->
        <div class="bg-blue-50 border border-blue-100 rounded-3xl p-6 mt-10 text-center select-none">
            <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 border border-blue-200">
                <svg class="w-5 h-5 text-blue-600 fill-none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .5 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
                    <path d="M9 18h6"/>
                    <path d="M10 22h4"/>
                </svg>
            </div>
            <p class="text-blue-700 text-xs sm:text-sm font-medium leading-relaxed max-w-lg mx-auto">
                Did you know? Consistent reading of 3 words a day expands your verbal comprehension exponentially. Keep checking back daily!
            </p>
        </div>

        <!-- Bottom Page Controls -->
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-200 pt-6">
            <!-- Left: Previous Day Button -->
            <button id="prev-day-btn-bottom" disabled class="w-full sm:w-auto px-5 py-3 bg-slate-50 text-slate-350 font-semibold rounded-2xl border border-slate-100 cursor-not-allowed text-sm flex items-center justify-center space-x-1.5 select-none transition-all">
                <svg class="w-4 h-4 text-slate-350" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span>Previous Day</span>
            </button>
            
            <!-- Center: Return to Top Button -->
            <button id="back-to-top-btn" class="w-full sm:w-auto px-5 py-3 bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold rounded-2xl border border-blue-200 text-sm flex items-center justify-center space-x-2 transition-all cursor-pointer">
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"></path>
                </svg>
                <span>Return to Top</span>
            </button>
            
            <!-- Right: Next Day Button -->
            <button id="next-day-btn-bottom" class="w-full sm:w-auto px-5 py-3 bg-white text-slate-655 font-semibold rounded-2xl border border-slate-200 hover:border-blue-400 hover:text-blue-600 transition-all text-sm flex items-center justify-center space-x-1.5 cursor-pointer select-none">
                <span>Next Day</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Core App Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/vocabulary.js"></script>
</body>
</html>
